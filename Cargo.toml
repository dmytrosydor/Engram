[package]
name = "engram"
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
description = "Local long-term memory for Claude Code: SQLite + FTS5 + sqlite-vec."
license = "MIT"
repository = "https://github.com/dmytrosydor/Engram"
readme = "README.md"
keywords = ["claude-code", "memory", "mcp", "sqlite", "embeddings"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
ratatui = "0.30.2"
rmcp = { version = "3.8.0", features = ["server", "transport-io", "macros"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
sqlite-vec = "0.1.9"
tokio = { version = "1.54.1", features = ["rt", "macros", "io-std", "net"] }
toml = "1.1.8"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3.27.0"
