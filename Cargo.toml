[package]
name = "engram"
version = "0.1.0"
edition = "2024"
description = "Local long-term memory for Claude Code: SQLite + FTS5 + sqlite-vec."
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlite-vec = "0.1.9"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3.27.0"
